name: Deploy Edge Functions
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Type-check das functions
        run: |
          for dir in supabase/functions/*/; do
            fn="${dir%/}"
            base="$(basename "$fn")"
            # Pastas prefixadas com "_" são módulos compartilhados, não functions
            # (não têm index.ts próprio e não são publicadas pelo Supabase CLI)
            if [[ "$base" == _* ]]; then
              echo "Pulando $fn (módulo compartilhado)"
              continue
            fi
            echo "Checando $fn"
            deno check "$fn/index.ts"
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # Mesma lógica do seu workflow de Pages: só publica se NÃO for PR
    if: github.event_name != 'pull_request'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref $PROJECT_ID
